name: Build and push Container Apps image

# Build-only, like the leave/expense workflows it replaces: rolling the image
# out to Container Apps is a manual `az containerapp update` (the summary at
# the end of the run prints the exact command). The app's service principal
# can't be given a role on the resource group in this org, so an automated
# deploy job would be permanently broken.
#
# Builds the single-container image (root Dockerfile: nginx + Functions host)
# that runs as ca-internal-processes.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-image.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/gabidodu/ita-internalprocesses

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: tags
        run: echo "image=${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Image pushed. Deploy manually:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "az containerapp update --name ca-internal-processes --resource-group rg-internal-processes --subscription 2c0c5038-ac67-487a-bc6e-3fbc5753ebee --container-name app --image ${{ steps.tags.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
