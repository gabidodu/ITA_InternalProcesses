server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin as today's Static Web Apps setup: `/api/*` is proxied to the
    # `api` sidecar container (reachable via localhost — both containers run
    # in the same Container Apps replica) instead of being a separate origin,
    # so the frontend's existing NEXT_PUBLIC_API_BASE_URL=/api convention and
    # the app's auth flow need no change. No trailing slash on proxy_pass: the
    # full incoming path (including "/api/...") is forwarded unchanged, since
    # the Functions host itself expects requests under its own "api/" route
    # prefix (host.json default).
    location /api/ {
        proxy_pass http://localhost:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Readiness probe target for the Container App (see the "web" container's
    # readinessProbe) — proxies to the "api" container the same way /api/
    # does, so this only succeeds once the Functions host is actually up.
    location = /healthz {
        proxy_pass http://localhost:80/api/Health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Next.js 16 static export writes flat "<route>.html" files (not
    # "<route>/index.html") — try the exact file, then with ".html" appended,
    # before falling back to a directory index or 404.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
